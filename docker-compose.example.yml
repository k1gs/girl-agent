# Example docker-compose.yml for headless deployment with WebUI behind Nginx.
# Copy to docker-compose.yml and edit, or run directly:
#   docker compose -f docker-compose.example.yml up -d
#
# For first-time setup (interactive ink wizard):
#   docker compose run --rm -it girl-agent
# Then once a profile exists, switch to detached mode:
#   docker compose up -d
version: "3.9"

services:
  girl-agent:
    image: ghcr.io/thesashadev/girl-agent:latest
    container_name: girl-agent
    restart: unless-stopped
    # We add --webui to start the internal express webui server on port 7777
    command: ["server", "--config", "/config/bot.json", "--headless", "--webui"]
    environment:
      GIRL_AGENT_DATA: /data
    volumes:
      - girl-agent-data:/data
      - ./bot.json:/config/bot.json:ro
    expose:
      - "7777"
    # to peek at logs:
    #   docker compose logs -f girl-agent

  nginx:
    image: nginx:alpine
    container_name: girl-agent-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - girl-agent

volumes:
  girl-agent-data:
